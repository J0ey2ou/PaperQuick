name: Package macOS (no tests)
on:
  push:
    branches: ['codex/macos-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Package ${{ matrix.arch }} - no tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install -r requirements-macos.txt
      - name: Build and archive without launching or testing
        run: python scripts/build_macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: PaperQuick-macOS-${{ matrix.arch }}
          path: |
            release/v*-macos/*.zip
            release/v*-macos/SHA256SUMS-*.txt
            release/v*-macos/update-macos-*.json
          if-no-files-found: error
          retention-days: 14
