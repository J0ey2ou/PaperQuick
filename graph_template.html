<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'">
<title>文献直达 · 离线文献图谱</title><style>
*{box-sizing:border-box}body{margin:0;background:#080f1c;color:#e5effb;font:15px 'Microsoft YaHei',sans-serif;background-image:radial-gradient(ellipse at 70% 0%,#18374a60,transparent 55%)}header{padding:26px 32px;background:linear-gradient(110deg,#101c2e,#0b1627);border-bottom:1px solid #223b55}header:before{content:'PAPERQUICK  /  KNOWLEDGE NETWORK';display:block;font:11px 'Segoe UI',sans-serif;letter-spacing:3px;color:#41d9e6;margin-bottom:12px}h1{font-size:27px;margin:0 0 8px}p{color:#8ca3be;margin:8px 0;line-height:1.7}.stats{display:flex;gap:16px;padding:22px 32px}.stat{background:linear-gradient(140deg,#14243a,#101c2e);border:1px solid #223b55;border-top:2px solid #41d9e6;border-radius:12px;padding:16px 24px;flex:1;color:#8ca3be;box-shadow:0 10px 30px #0002}.stat:nth-child(2){border-top-color:#7c9bff}.stat:nth-child(3){border-top-color:#65dbb0}.stat:nth-child(4){border-top-color:#bf9afb}.stat b{font-size:30px;display:block;margin-bottom:4px;color:#41d9e6;font-family:'Segoe UI',sans-serif}.stat:nth-child(2) b{color:#7c9bff}.stat:nth-child(3) b{color:#65dbb0}.stat:nth-child(4) b{color:#bf9afb}main{padding:0 32px 28px}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}button,select,input{font:inherit;border:1px solid #29445f;color:#e5effb;background:#101c2e;border-radius:7px;padding:9px 12px;outline:none}input:focus,select:focus,button:focus-visible{border-color:#41d9e6;box-shadow:0 0 0 2px #41d9e630}button{cursor:pointer;color:#87e7ef;transition:background .15s}button:hover{background:#203950}button.active{background:#41d9e6;color:#06212c;border-color:#41d9e6;font-weight:700}.panel{background:#101c2e;border:1px solid #223b55;border-radius:12px;overflow:hidden;box-shadow:0 15px 50px #0003}.network{display:grid;grid-template-columns:minmax(400px,1fr) 310px}canvas{width:100%;height:560px;touch-action:none;background-color:#0b1627;background-image:linear-gradient(#25426130 1px,transparent 1px),linear-gradient(90deg,#25426130 1px,transparent 1px);background-size:32px 32px}aside{padding:20px;border-left:1px solid #223b55;overflow:auto;max-height:560px;background:#101c2e}aside h3{font-size:17px;line-height:1.6;color:#b0f1f4}small{color:#8ca3be}.legend{padding:12px 18px;background:#111f32;color:#8ca3be;font-size:13px;border-top:1px solid #223b55}.bar{display:flex;align-items:center;gap:12px;padding:17px 22px;border-bottom:1px solid #223b55}.bar strong{width:180px}.track{background:#1a2d43;height:16px;flex:1;border-radius:5px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#4777e3,#41d9e6)}.list{max-height:410px;overflow:auto}.item{padding:18px 22px;border-top:1px solid #223b55}.item:nth-child(even){background:#132237}.item b{display:block;line-height:1.6;margin-bottom:4px}.muted{color:#8ca3be}label{display:flex;align-items:center;gap:5px}input[type=checkbox]{accent-color:#41d9e6}#collection[hidden],#relationships[hidden]{display:none}::-webkit-scrollbar{width:9px;background:#080f1c}::-webkit-scrollbar-thumb{background:#29445f;border-radius:5px}@media(max-width:800px){.network{display:block}aside{border-left:0;max-height:240px}main,.stats{padding-left:15px;padding-right:15px}.stats{flex-wrap:wrap}.stat{min-width:140px}}@media(prefers-reduced-motion:reduce){button{transition:none}}
</style><header><h1>文献直达 · 文献图谱</h1><p>从课题看收藏进度，从文献看研究关系。此页面完全离线，可直接保存与打开。</p></header>
<section class="stats" id="stats"></section><main><div class="tools"><button class="active" id="collectionTab">收藏概览</button><button id="relationshipTab">文献关系</button><select id="project"><option value="">所有课题</option></select><input id="search" placeholder="搜索标题 / DOI"><select id="highlightMode"><option value="downloaded">按是否下载高亮</option><option value="read_count">按阅读次数高亮</option><option value="citation_count">按本地被引用次数高亮</option><option value="custom">自定义权重高亮</option></select><button id="reset">重置视图</button></div>
<section class="panel" id="collection"><div id="bars"></div><div class="list" id="list"></div></section>
<section class="panel" id="relationships" hidden><div class="tools" style="padding:16px;margin:0"><label><input type="checkbox" id="similarity" checked> 内容相似</label><label><input type="checkbox" id="citation" checked> 本地引用证据</label><label><input type="checkbox" id="candidate" checked> 未入库候选</label><small>拖动节点 · 滚轮缩放 · 点击看详情</small></div><div class="network"><canvas id="canvas"></canvas><aside id="detail"><h3>选中一篇文献</h3><p>蓝色实线：标题、摘要、关键词的本地 TF-IDF 相似度。</p><p>橙色箭头：已提取 PDF 参考文献章节中的 DOI 匹配。</p><p>引用仅覆盖本地已收藏文献；扫描件、未解析章节及 PDF 后部未提取的引用可能缺失。</p></aside></div><div class="legend">节点颜色与大小按所选高亮模式变化 · 空心节点 / 虚线表示未入库候选 · 引用次数仅为本地证据，不代表全球被引量。</div></section><p>不调用外部 AI，不发送文献内容，不请求网络接口。图谱是生成时的快照；修改文献库后重新生成即可更新。</p></main>
<script id="data" type="application/json">__DATA__</script><script>
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const highlight=data.highlight||{mode:'downloaded',low:'#7088a7',high:'#41d9e6',candidate:'#bf9afb',read_weight:1,citation_weight:1,download_weight:2};$('highlightMode').value=highlight.mode;
let view='collection',visible=[],edges=[],scale=1,ox=0,oy=0,drag=null,selected=null;
const projects=[...new Set(data.nodes.flatMap(n=>n.projects))].sort();projects.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;$('project').append(o)});
function refresh(){visible=data.nodes.filter(n=>($('candidate').checked||n.in_library!==false)&&(!$('project').value||n.projects.includes($('project').value))&&(`${n.title} ${n.doi}`.toLowerCase().includes($('search').value.toLowerCase())));const ids=new Set(visible.map(n=>n.id));edges=data.edges.filter(e=>ids.has(e.source)&&ids.has(e.target)&&$(e.kind).checked);
const counts=[['收藏文献',visible.filter(n=>n.in_library!==false).length],['已归档 PDF',visible.filter(n=>n.pdf).length],['已读',visible.filter(n=>n.status==='已读').length],['未入库候选',visible.filter(n=>n.in_library===false).length]];$('stats').innerHTML=counts.map(([label,n])=>`<div class="stat"><b>${n}</b>${label}</div>`).join('');
$('bars').innerHTML=projects.map(p=>{const n=visible.filter(n=>n.in_library!==false&&n.projects.includes(p)).length;return `<div class="bar"><strong>${esc(p)}</strong><div class="track"><div class="fill" style="width:${100*n/Math.max(1,visible.length)}%"></div></div><span>${n} 篇</span></div>`}).join('');
$('list').innerHTML=visible.map(n=>`<div class="item"><b>${esc(n.title)}</b><small>${esc(n.year||'年份待补充')} · ${esc(n.projects.join(' / '))} · ${esc(n.status)} · ${n.pdf?'已归档 PDF':'待添加 PDF'}</small></div>`).join('')||'<p style="padding:22px">没有匹配的文献</p>';layout();draw()}
function tab(name){view=name;for(const v of ['collection','relationships'])$(v).hidden=v!==name;$('collectionTab').classList.toggle('active',name==='collection');$('relationshipTab').classList.toggle('active',name==='relationships');if(name==='relationships')resize()}
$('collectionTab').onclick=()=>tab('collection');$('relationshipTab').onclick=()=>tab('relationships');['project','search','similarity','citation','candidate'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',refresh));$('reset').onclick=()=>{scale=1;ox=oy=0;layout();draw()};
$('highlightMode').onchange=()=>{highlight.mode=$('highlightMode').value;draw()};
const canvas=$('canvas'),ctx=canvas.getContext('2d');let width=800,height=560,positions=new Map();
function resize(){width=canvas.clientWidth||800;height=canvas.clientHeight||560;canvas.width=width*devicePixelRatio;canvas.height=height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);layout();draw()}
function layout(){positions=new Map();visible.forEach((n,i)=>{const angle=i*2.39996,r=25+Math.sqrt(i)*Math.min(14,220/Math.sqrt(Math.max(1,visible.length)));positions.set(n.id,{x:width/2+r*Math.cos(angle),y:height/2+r*Math.sin(angle)})});
// A bounded deterministic layout: graph generation and browsing work without services.
if(visible.length<=650)for(let k=0;k<45;k++){for(const e of edges){const a=positions.get(e.source),b=positions.get(e.target),dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,f=(d-90)*.012;a.x+=dx/d*f;a.y+=dy/d*f;b.x-=dx/d*f;b.y-=dy/d*f}for(let i=0;i<visible.length;i++)for(let j=i+1;j<visible.length;j++){const a=positions.get(visible[i].id),b=positions.get(visible[j].id),dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;if(d<35){const f=(35-d)*.06;a.x-=dx/d*f;a.y-=dy/d*f;b.x+=dx/d*f;b.y+=dy/d*f}}}
if(positions.size){const points=[...positions.values()],minX=Math.min(...points.map(p=>p.x)),maxX=Math.max(...points.map(p=>p.x)),minY=Math.min(...points.map(p=>p.y)),maxY=Math.max(...points.map(p=>p.y));const factor=Math.min(6,(width-230)/Math.max(1,maxX-minX),(height-110)/Math.max(1,maxY-minY));for(const p of points){p.x=width/2-50+(p.x-(minX+maxX)/2)*factor;p.y=height/2+(p.y-(minY+maxY)/2)*factor}}}
function draw(){ctx.clearRect(0,0,width,height);ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);for(const e of edges){const a=positions.get(e.source),b=positions.get(e.target);ctx.setLineDash(e.kind==='candidate'?[4,5]:[]);ctx.strokeStyle=e.kind==='candidate'?highlight.candidate:e.kind==='citation'?'#eeac5f':'#38597e';ctx.lineWidth=e.kind==='citation'?1.5:1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();if(e.kind==='citation'){const t=Math.atan2(b.y-a.y,b.x-a.x),x=b.x-Math.cos(t)*9,y=b.y-Math.sin(t)*9;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-9*Math.cos(t-.45),y-9*Math.sin(t-.45));ctx.lineTo(x-9*Math.cos(t+.45),y-9*Math.sin(t+.45));ctx.closePath();ctx.fillStyle='#eeac5f';ctx.fill()}}ctx.setLineDash([]);const maximum=Math.max(1,...visible.filter(n=>n.in_library!==false).map(nodeScore));for(const n of visible){const p=positions.get(n.id),ratio=nodeScore(n)/maximum,r=n.id===selected?9:4+4*ratio;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=nodeColor(n,ratio);if(n.in_library===false){ctx.strokeStyle=highlight.candidate;ctx.lineWidth=1.5;ctx.stroke()}else ctx.fill();if(visible.length<35||n.id===selected){ctx.fillStyle='#b7cce4';ctx.font='11px sans-serif';ctx.fillText(n.title.slice(0,27),p.x+10,p.y+4)}}ctx.restore()}
function nodeScore(n){if(highlight.mode==='downloaded')return n.pdf?1:0;if(highlight.mode==='read_count'||highlight.mode==='citation_count')return Math.log1p(n[highlight.mode]||0);return Math.log1p(n.read_count||0)*highlight.read_weight+Math.log1p(n.citation_count||0)*highlight.citation_weight+(n.pdf?highlight.download_weight:0)}
function nodeColor(n,ratio){if(n.in_library===false)return highlight.candidate;const a=highlight.low,b=highlight.high;return '#'+[1,3,5].map(i=>Math.round(parseInt(a.slice(i,i+2),16)+(parseInt(b.slice(i,i+2),16)-parseInt(a.slice(i,i+2),16))*ratio).toString(16).padStart(2,'0')).join('')}
function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}}
canvas.onpointerdown=e=>{const p=point(e),n=visible.find(n=>Math.hypot(positions.get(n.id).x-p.x,positions.get(n.id).y-p.y)<12/scale);if(n){drag=n.id;selected=n.id;canvas.setPointerCapture(e.pointerId);const linked=edges.filter(x=>x.source===n.id||x.target===n.id);$('detail').innerHTML=`<h3>${esc(n.title)}</h3><p>${esc(n.year)} · ${esc(n.status)}<br>${esc(n.projects.join(' / '))}<br>${n.in_library===false?'未入库候选 · 关系需核对':n.pdf?'已归档 PDF':'待添加 PDF'}<br>阅读 ${n.read_count||0} 次 · 本地被引用 ${n.citation_count||0} 次</p><small>${esc(n.doi)}</small><h3>关系 ${linked.length}</h3>`+linked.slice(0,30).map(e=>{const other=data.nodes.find(x=>x.id===(e.source===n.id?e.target:e.source));return `<p>${e.kind==='candidate'?'候选关系（待核对）':e.kind==='citation'?(e.source===n.id?'引用 →':'被引用 ←'):'相似 '+e.weight} ${esc(other.title)}</p>`}).join('');draw()}};canvas.onpointermove=e=>{if(drag){positions.set(drag,point(e));draw()}};canvas.onpointerup=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,old=scale;scale=Math.max(.3,Math.min(4,scale*(e.deltaY<0?1.12:.89)));ox=x-(x-ox)*scale/old;oy=y-(y-oy)*scale/old;draw()};window.onresize=resize;refresh();
</script></html>
